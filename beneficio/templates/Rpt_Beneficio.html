	function Recargar_grillaBeneficio() {
		
		var txtfechaini=$("#txtfechaini").val();
		var txtfechafin=$("#txtfechafin").val();
		
		$("#grid-tableingreso").jqGrid("setGridParam",
						{
							page : 1,
							url : '/beneficio/zRptBeneficio?txtfechaini='+txtfechaini+'&txtfechafin='+txtfechafin,
							datatype : "json"
						}).trigger("reloadGrid");

		return [ true, '' ];
	}

				  
	  		
	  function FormatoCelda1(cellvalue, options, rowObject) {
			
					
			if (esEntero(cellvalue))
				{
				return number_format(cellvalue);
				}
			else{
					return number_format(cellvalue,2);	
				}
			
	
		}
	  
	  function FormatoCelda2(cellvalue, options, rowObject) {
		  
			if (cellvalue==null)
				{
				return "<font size=2 color=red><b></b></font>";
				}
			else{
				return "<font size=2 color=red><b>"+ cellvalue + "</b></font>";
			}
			
		}
	  

function number_format(amount, decimals) {

    amount += ''; // por si pasan un numero en vez de un string
    amount = parseFloat(amount.replace(/[^0-9\.]/g, '')); // elimino cualquier cosa que no sea numero o punto

    decimals = decimals || 0; // por si la variable no fue fue pasada

    // si no es un numero o es igual a cero retorno el mismo cero
    if (isNaN(amount) || amount === 0) 
        return parseFloat(0).toFixed(decimals);

    // si es mayor o menor que cero retorno el valor formateado como numero
    amount = '' + amount.toFixed(decimals);

    var amount_parts = amount.split('.'),
        regexp = /(\d+)(\d{3})/;

    while (regexp.test(amount_parts[0]))
        amount_parts[0] = amount_parts[0].replace(regexp, '$1' + ',' + '$2');

    return amount_parts.join('.');
}

function esEntero(numero){
    if (numero - Math.floor(numero) == 0) {
        return true;
    }
    else{
        return false;
    }
}
