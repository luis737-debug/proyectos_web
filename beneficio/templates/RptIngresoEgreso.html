	errorPlacement: function (error, element) {
		if(element.is('input[type=checkbox]') || element.is('input[type=radio]')) {
			var controls = element.closest('div[class*="col-"]');
			if(controls.find(':checkbox,:radio').length > 1) controls.append(error);
			else error.insertAfter(element.nextAll('.lbl:eq(0)').eq(0));
		}
		else if(element.is('.select2')) {
			error.insertAfter(element.siblings('[class*="select2-container"]:eq(0)'));
		}
		else if(element.is('.chosen-select')) {
			error.insertAfter(element.siblings('[class*="chosen-container"]:eq(0)'));
		}
		else error.insertAfter(element);
	},

	function Recargar_grillaIngreso_3(txtfechaingreso) {

		var txtfechaingreso=$("#txtfechaingreso").val();
		
		$("#grid-tableingreso").jqGrid("setGridParam",
						{
							page : 1,
							url : '/beneficio/listaringresoegreso?fecha_ingreso='+ txtfechaingreso,
							datatype : "json"
						}).trigger("reloadGrid");

		return [ true, '' ];
	}

		
	function Calculo(fecha) {
		
		var fecha=$("#txtfechaingreso").val();
			
		$.ajax({
			type : 'get',
			dataType : 'json',
			url : '/beneficio/calculo_ingresoegreso?fecha='+ fecha,
			beforeSend : function() {
			},
			success : function(resultgenfac) {
				
				var jsongenfac_ = resultgenfac;

				$.each(jsongenfac_, function(j, resultgenfac) {
					
					//Planta
					var total_ingreso     = resultgenfac['monto_ingreso'];
					var total_egreso      = resultgenfac['monto_egreso'];
					var total_saldo       = resultgenfac['monto_saldo'];
									
										
					$("#txtvalor1").html('<b>TOTAL INGRESO :</b><font size=2 color=blue><b>'+total_ingreso+'</b></font>');
					$("#txtvalor2").html('<b>TOTAL EGRESO  :</b><font size=2 color=red><b>'+total_egreso+'</b></font>');
					
					if (parseFloat(total_ingreso) - parseFloat(total_egreso) >0)
						{
						$("#txtvalor3").html('<b><u>TOTAL SALDO</u> :</b><font size=3 color=green><b>'+total_saldo+'</b></font>');
						}else {
						$("#txtvalor3").html('<b><u>TOTAL SALDO</u> :</b><font size=3 color=red><b>'+total_saldo+'</b></font>');	
						}
					
										
				});
			},

			error : function(xhr, ajaxOptions, thrownError) {
				alert(xhr.status + ' ' + thrownError);
			}
		});
	}
