	function Recargar_grillaIngreso() {

			var txtfechaingreso=$("#txtfechaingreso").val();
		
		$("#grid-tableingreso").jqGrid("setGridParam",
						{
							page : 1,
							url : '/beneficio/listarDetalleIngreso?fecha_ingreso='+ txtfechaingreso,
							datatype : "json"
						}).trigger("reloadGrid");

		return [ true, '' ];
	}

		

	function Calculo(fecha) {
	
		var fecha=$("#txtfechaingreso").val();

		$.ajax({
			type : 'get',
			dataType : 'text',
			url : '/beneficio/calculo?fecha='+ fecha,
			beforeSend : function() {
			},
			success : function(resultgenfac) {
				
				var jsongenfac_ = jQuery.parseJSON(resultgenfac);
				$.each(jsongenfac_, function(j, resultgenfac) {
					
					//Planta
					var total_beneficio     = resultgenfac['total_beneficio'];
					var total_tripa         = resultgenfac['total_tripa'];
					var total_buche         = resultgenfac['total_buche'];
					var total_grasa_mercado = resultgenfac['total_grasa_mercado'];
					var promedio_tripa      = resultgenfac['promedio_tripa'];
					
					//Hiscash
					var total_bidon_pluma = resultgenfac['total_bidon_pluma'];
					var total_bidon_tripa = resultgenfac['total_bidon_tripa'];
															
					$("#txtvalor1").html(total_beneficio);
					$("#txtvalor2").html(total_tripa);
					$("#txtvalor2a").html(total_buche);
					
					if (parseFloat(promedio_tripa)>0)
						{
						$("#txtvalor3").html(promedio_tripa);
						$("#txtvalor3a").html('');
						}else{
							$("#txtvalor3a").html(promedio_tripa);
							$("#txtvalor3").html('');
						}
					
					$("#txtvalor4").html(total_grasa_mercado);
					
					$("#txtvalor5").html(total_bidon_pluma);
					$("#txtvalor6").html(total_bidon_tripa);
							
					
				});
			},

			error : function(xhr, ajaxOptions, thrownError) {
				alert(xhr.status + ' ' + thrownError);
			}
		});
	}
