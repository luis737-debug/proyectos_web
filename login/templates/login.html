{% load static %}

<!DOCTYPE html>
<html lang="en">
	<head>
		<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
		<meta charset="utf-8" />
		<title>Sistema de Ventas y Compras</title>
		<meta name="description" content="User login page" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />

		<!-- bootstrap & fontawesome -->
	
		<link rel="stylesheet" href="{% static 'css/bootstrap.css' %}" />
		<link rel="stylesheet" href="{% static 'css/font-awesome.css' %}" />

		<!-- page specific plugin styles -->

		<!-- text fonts -->
		<link rel="stylesheet" href="{% static 'css/ace-fonts.css' %}" />

		<!-- ace styles -->
		<link rel="stylesheet" href="{% static 'css/ace.css' %}" class="ace-main-stylesheet" id="main-ace-style" />

		<!-- ace settings handler -->
		<script src="{% static 'js/ace-extra.js' %}"></script>
			
	</head>

	<body class="login-layout blur-login" id="main-principal" >
		<div class="main-container" >
			<div class="main-content">
				<div class="row">
					<div class="col-sm-10 col-sm-offset-1">
						<div class="login-container">
							<div class="center">
								<h1>
									<i class="ace-icon fa fa-cog green"></i>
									<span class="white" id="id-text2">Sistema</span>
								</h1>
							</div>

							<div class="space-6"></div>

							<div class="position-relative">
								<div id="login-box" class="login-box visible widget-box no-border">
									<div class="widget-body">
										<div class="widget-main">
											<h4 class="header blue lighter bigger">
												<i class="ace-icon fa fa-coffee green"></i>
												Por favor ingrese sus datos
											</h4>

											<div class="space-6"></div>
											{% csrf_token %}
											<form >
												<fieldset>
													<label class="block clearfix">
														<span class="block input-icon input-icon-right">
															<input type="text" id="txtusuario" class="form-control" placeholder="Ingrese Usuario" />
															<i class="ace-icon fa fa-user"></i>
														</span>
													</label>

													<label class="block clearfix">
														<span class="block input-icon input-icon-right">
															<input type="password" id="txtclave" class="form-control" placeholder="Ingrese Clave" />
															<i class="ace-icon fa fa-lock"></i>
														</span>
													</label>

													<div class="space" ></div>
												    
													<div class="clearfix">
												       <a href="JavaScript:ingresar();">
															<button type="button" class="width-35 pull-right btn btn-sm btn-primary">
																<i class="ace-icon fa fa-key"></i>
																<span class="bigger-110">Aceptar</span>
															</button>
												       </a>
													</div>

													<div class="space-4"></div>
												</fieldset>
											</form>

											<div class="social-or-login center">
												<span class="bigger-110"></span>
											</div>

											<div class="space-6"></div>


										</div><!-- /.widget-main -->

										<div class="toolbar clearfix"  id="mensaje" >
											<br/><br/>
										</div>
									</div><!-- /.widget-body -->
								</div><!-- /.login-box -->

							    </div><!-- /.position-relative -->


							<div class="center">
								<h6 class="blue">&copy; Copyright 2015 Todos los derechos reservados</h6>
							</div>
						</div>
					</div><!-- /.col -->
				</div><!-- /.row -->
			</div><!-- /.main-content -->
		</div><!-- /.main-container -->

		<!-- basic scripts -->

		<!--[if !IE]> -->
		<script type="text/javascript">
			window.jQuery || document.write("<script src='{% static 'js/jquery.js' %}'>"+"<"+"/script>");
		</script>

        <link rel="stylesheet" href="{% static 'css/ace.onpage-help.css' %}" />

		<script type="text/javascript">
			if('ontouchstart' in document.documentElement) document.write("<script src='{% static 'js/jquery.mobile.custom.js' %} >"+"<"+"/script>");
		</script>

		<!-- inline scripts related to this page -->
		<script type="text/javascript">
			jQuery(function($) {
			 $(document).on('click', '.toolbar a[data-target]', function(e) {
				e.preventDefault();
				var target = $(this).data('target');
				$('.widget-box.visible').removeClass('visible');//hide others
				$(target).addClass('visible');//show target
			 });
			});
			
			//you don't need this, just used for changing background
			
			jQuery(function($) {
			 $('#btn-login-dark').on('click', function(e) {
				$('body').attr('class', 'login-layout');
				$('#id-text2').attr('class', 'white');
				$('#id-company-text').attr('class', 'blue');
				
				e.preventDefault();
			 });
			 $('#btn-login-light').on('click', function(e) {
				$('body').attr('class', 'login-layout light-login');
				$('#id-text2').attr('class', 'grey');
				$('#id-company-text').attr('class', 'blue');
				
				e.preventDefault();
			 });
			 $('#btn-login-blur').on('click', function(e) {
				$('body').attr('class', 'login-layout blur-login');
				$('#id-text2').attr('class', 'white');
				$('#id-company-text').attr('class', 'light-blue');
				
				e.preventDefault();
			 });
			 
			});
		</script>
		

		<script src="{% static 'login/js/login.js' %}"></script>
	</body>
</html>
